    <!-- Mobile Controls Toggle -->
    <button class="mobile-controls-toggle" id="mobileToggle" onclick="toggleMobileControls()" aria-label="Toggle controls" aria-expanded="false">
        <span class="mobile-toggle-icon" aria-hidden="true"><span></span></span>
    </button>

    <!-- Match Complete Overlay -->
    <div class="match-complete-overlay" id="matchCompleteOverlay">
        <div class="winner-announcement" id="winnerAnnouncement">TEAM A WINS!</div>
        <div class="final-result" id="finalResult">Final Score: 3-1</div>
        <div class="match-complete-actions">
            <button class="action-btn" onclick="newMatch()">New Match</button>
            <button class="action-btn" onclick="backToGenerator()">Back to Generator</button>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script type="module">
        // ===== FIREBASE CONFIGURATION (SEGNAPOSTO) =====
        const firebaseConfig = {
            apiKey: "AIzaSyDVFrN-OOzEvzcsNrtYn_6HhIDF6dXtYJ4",
            authDomain: "volley-hub-c90ca.firebaseapp.com",
            databaseURL: "https://volley-hub-c90ca-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "volley-hub-c90ca",
            storageBucket: "volley-hub-c90ca.firebasestorage.app",
            messagingSenderId: "614392919865",
            appId: "1:614392919865:web:f1273d14c2159b67089ae8",
            measurementId: "G-457ZV7RM43"
        };

        // Inizializzazione Firebase
        let db = null;
        let auth = null;
        if (typeof firebase !== 'undefined') {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            auth = firebase.auth();
            db = firebase.database();
        }

        // ===== GAME STATE =====
        let gameState = {
            currentSet: 1,
            scoreA: 0,
            scoreB: 0,
            setsWonA: 0,
            setsWonB: 0,
            servingTeam: 'A',
            receivingTeam: 'B',
            servingTeamLocked: false,
            history: [],
            // Persistent Timer State
            timerLastStartedAt: 0,     // Timestamp ms
            timerAccumulatedSeconds: 0, // Seconds before last start
            timerIsPaused: true,
            timerInterval: null,
            matchComplete: false,
            teamAPlayers: [],
            teamBPlayers: [],
            rotationA: 0,
            rotationB: 0,
            teamAName: 'TEAM A',
            teamBName: 'TEAM B',
            teamAColor: '#00fbff',
            teamBColor: '#ff0055',
            matchSource: 'index',
            lastSavedAt: null
        };
        const FORMATION_DATA_KEY = 'formation';
        const DEFAULT_MATCH_SOURCE = 'index';
        const MOBILE_LAYOUT_QUERY = '(max-width: 900px) and (hover: none), (max-width: 900px) and (pointer: coarse)';
        let currentUserUid = null;
        let liveMatchRef = null;
        let activeMatchSource = DEFAULT_MATCH_SOURCE;
        let hasLaunchPayload = false;
        let activeMatchKey = null;

        // ===== INITIALIZATION =====
        document.addEventListener('DOMContentLoaded', () => {
            console.log("DOMContentLoaded: Initializing LIVE MATCH MODE");
            activeMatchSource = getRequestedMatchSource();
            activeMatchKey = getRequestedMatchKey();

            // 1. Carica i dati del roster/squadre dall'app principale
            loadFromMainApp();
            renderLiveMatchUI();

            // 2. Aggancia l'utente Firebase e sincronizza sotto lo stesso ramo usato da index.html
            if (auth) {
                auth.onAuthStateChanged(async (user) => {
                    currentUserUid = user ? user.uid : null;
                    if (!currentUserUid) {
                        detachLiveMatchSync();
                        return;
                    }

                    if (activeMatchSource === 'index' && !localStorage.getItem(getLiveMatchDataStorageKey())) {
                        const loadedFromFormation = await loadFormationFromFirebase();
                        if (loadedFromFormation) renderLiveMatchUI();
                    }

                    attachLiveMatchSync();
                });
            }

            // 3. Setup UI events
            setupUIEvents();
            initScoreboardFullscreen();

            // 4. Resize handling per il campo tattico
            const wrapper = document.getElementById('tacticalWrapper');
            if (wrapper) {
                new ResizeObserver(() => {
                    resizeTacticalCourt();
                    updateTacticalCourt();
                }).observe(wrapper);
            }
            const court = document.getElementById('courtFloor');
            if (court) court.addEventListener('click', handleCourtRotationClick);
            syncResponsiveLayout();
            window.addEventListener('resize', syncResponsiveLayout);
        });

        function normalizeMatchSource(source) {
            return source === 'matcharena' ? 'matcharena' : DEFAULT_MATCH_SOURCE;
        }

        function getRequestedMatchSource() {
            const params = new URLSearchParams(window.location.search);
            return normalizeMatchSource(params.get('src'));
        }

        function normalizeMatchKey(value) {
            return (value || '')
                .toLowerCase()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .replace(/[^a-z0-9_-]+/g, '-')
                .replace(/^-+|-+$/g, '')
                .slice(0, 120);
        }

        function getRequestedMatchKey() {
            const params = new URLSearchParams(window.location.search);
            return normalizeMatchKey(params.get('matchKey'));
        }

        function getLiveMatchDataStorageKey() {
            return activeMatchKey
                ? `squadGen3D_liveMatchData_${activeMatchSource}_${activeMatchKey}`
                : `squadGen3D_liveMatchData_${activeMatchSource}`;
        }

        function getLiveProgressStorageKey() {
            return activeMatchKey
                ? `squadGen3D_liveMatchProgress_${activeMatchSource}_${activeMatchKey}`
                : `squadGen3D_liveMatchProgress_${activeMatchSource}`;
        }

        function getLiveProgressFirebaseKey() {
            return activeMatchKey
                ? `liveMatchProgress_${activeMatchSource}/${activeMatchKey}`
                : `liveMatchProgress_${activeMatchSource}`;
        }

        function getUserMatchDataPath(key) {
            if (!currentUserUid) return null;
            return `users/${currentUserUid}/matchData/${key}`;
        }

        function detachLiveMatchSync() {
            if (liveMatchRef) {
                liveMatchRef.off();
                liveMatchRef = null;
            }
        }

        function attachLiveMatchSync() {
            if (!db || !currentUserUid) return;
            const liveMatchPath = getUserMatchDataPath(getLiveProgressFirebaseKey());
            if (!liveMatchPath) return;

            detachLiveMatchSync();
            liveMatchRef = db.ref(liveMatchPath);
            liveMatchRef.on('value', (snapshot) => {
                const remoteData = snapshot.val();
                if (remoteData) {
                    console.log("Dati live ricevuti da Firebase:", remoteData);
                    const mergedData = shouldMergeLaunchPayload(remoteData)
                        ? mergeLaunchPayloadWithRemote(remoteData)
                        : remoteData;
                    applyRemoteState(mergedData);
                } else {
                    saveMatchStateToFirebase(gameState);
                }
            }, (error) => {
                console.error("Errore lettura Firebase live match:", error);
            });
        }

        function shouldMergeLaunchPayload(remoteData) {
            return activeMatchSource === 'matcharena' && hasLaunchPayload && !!remoteData;
        }

        function mergeLaunchPayloadWithRemote(remoteData) {
            return {
                ...remoteData,
                teamAPlayers: gameState.teamAPlayers,
                teamBPlayers: gameState.teamBPlayers,
                teamAName: gameState.teamAName,
                teamBName: gameState.teamBName,
                teamAColor: gameState.teamAColor,
                teamBColor: gameState.teamBColor,
                matchSource: activeMatchSource
            };
        }

        // ===== FIREBASE SYNC (SCRITTURA/LETTURA) =====
        function saveMatchStateToFirebase(state) {
            if (!db || !currentUserUid) return;
            const liveMatchPath = getUserMatchDataPath(getLiveProgressFirebaseKey());
            if (!liveMatchPath) return;
            const dataToSave = { ...state, savedAt: new Date().toISOString() };
            delete dataToSave.timerInterval; // Non serializzabile
            db.ref(liveMatchPath).set(dataToSave).catch(e => console.error("Errore salvataggio Firebase:", e));
        }

        function loadLiveMatchProgress() {
            // First try Firebase if available
            const liveMatchPath = getUserMatchDataPath(getLiveProgressFirebaseKey());
            if (db && liveMatchPath) {
                db.ref(liveMatchPath).once('value').then((snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        applyRemoteState(data);
                        showToast('Match restored from Cloud');
                        return;
                    }
                    // If no Firebase data, try localStorage
                    loadFromLocalStorage();
                });
            } else {
                loadFromLocalStorage();
            }
        }

        function loadFromLocalStorage() {
            const dataStr = localStorage.getItem(getLiveProgressStorageKey());
            if (!dataStr) return;
            try {
                const data = JSON.parse(dataStr);
                applyRemoteState(data);
                showToast('Match restored from Local Storage');
            } catch (e) {
                console.error("Error loading progress:", e);
            }
        }

        async function loadFormationFromFirebase() {
            if (!db || !currentUserUid) return false;
            const formationPath = getUserMatchDataPath(FORMATION_DATA_KEY);
            if (!formationPath) return false;

            try {
                const [formationSnap, playersSnap] = await Promise.all([
                    db.ref(formationPath).once('value'),
                    db.ref(`users/${currentUserUid}/players`).once('value')
                ]);
                const formation = formationSnap.val();
                if (!formation || !Array.isArray(formation.tokens)) return false;

                const roster = Array.isArray(playersSnap.val()) ? playersSnap.val() : [];
                const rosterByName = new Map(roster.map(player => [player.name, player]));
                const courtTokens = formation.tokens.filter(token => token.parent === 'courtFloor');
                const teamATokens = courtTokens.filter(token => token.team === 'team-a');
                const teamBTokens = courtTokens.filter(token => token.team === 'team-b');
                const toLivePlayer = (token, fallbackNum) => {
                    const source = rosterByName.get(token.name) || {};
                    return {
                        ...source,
                        name: token.name || source.name || `Player ${fallbackNum}`,
                        num: source.num || fallbackNum,
                        role: token.role || source.role || 'Universal',
                        gender: token.gender || source.gender || 'male',
                        currentTop: token.top,
                        currentLeft: token.left
                    };
                };

                gameState.teamAPlayers = normalizeImportedRotationOrder(
                    teamATokens.map((token, index) => toLivePlayer(token, index + 1)),
                    'A'
                );
                gameState.teamBPlayers = normalizeImportedRotationOrder(
                    teamBTokens.map((token, index) => toLivePlayer(token, index + 1)),
                    'B'
                );
                gameState.teamAName = formation.benchA || gameState.teamAName;
                gameState.teamBName = formation.benchB || gameState.teamBName;

                if (!hasMeaningfulProgress(gameState)) {
                    gameState.scoreA = Number(formation.scoreA) || 0;
                    gameState.scoreB = Number(formation.scoreB) || 0;
                }

                updateTeamNames();
                return true;
            } catch (e) {
                console.error("Error loading formation from Firebase:", e);
                return false;
            }
        }

        function applyRemoteState(data) {
            // Aggiorniamo l'oggetto locale con i dati remoti
            gameState = { ...gameState, ...data };

            // Sincronizziamo il timer e aggiorniamo la UI
            syncTimerFromRemote();
            renderLiveMatchUI();

            if (gameState.matchComplete) {
                document.getElementById('matchCompleteOverlay').classList.add('active');
            }
        }

        function renderLiveMatchUI() {
            applyTeamColors();
            updateScoreboard();
            updateTacticalCourt();
            updateSetsUI();
            renderRotationGrid();
            updateServingIndicator();
            updateCompNames();
            updateHistoryDisplay();
            updateMobilePanelMetrics();
        }

        function persistLiveMatchState() {
            const progressData = { ...gameState, savedAt: new Date().toISOString() };
            delete progressData.timerInterval;
            storeProgressLocally(progressData);
            saveMatchStateToFirebase(gameState);
        }

        // ===== TIMER LOGIC (PERSISTENT) =====
        function getClockTime() {
            if (gameState.timerIsPaused) return gameState.timerAccumulatedSeconds;
            const now = Date.now();
            const elapsedSinceStart = (now - gameState.timerLastStartedAt) / 1000;
            return gameState.timerAccumulatedSeconds + elapsedSinceStart;
        }

        function syncTimerFromRemote() {
            clearTimerInterval();
            if (!gameState.timerIsPaused && !gameState.matchComplete) {
                startTimerInterval();
            }
            updateTimerDisplay();
        }

        function startTimer() {
            if (gameState.timerIsPaused && !gameState.matchComplete) {
                gameState.timerIsPaused = false;
                gameState.timerLastStartedAt = Date.now();
                startTimerInterval();
                saveMatchStateToFirebase(gameState);
            }
        }

        function pauseTimer() {
            if (!gameState.timerIsPaused) {
                gameState.timerAccumulatedSeconds = getClockTime();
                gameState.timerIsPaused = true;
                clearTimerInterval();
                saveMatchStateToFirebase(gameState);
                updateTimerDisplay();
            }
        }

        function resetTimer() {
            gameState.timerAccumulatedSeconds = 0;
            gameState.timerLastStartedAt = 0;
            gameState.timerIsPaused = true;
            clearTimerInterval();
            updateTimerDisplay();
            saveMatchStateToFirebase(gameState);
        }

        function startTimerInterval() {
            clearTimerInterval();
            gameState.timerInterval = setInterval(updateTimerDisplay, 1000);
        }

        function clearTimerInterval() {
            if (gameState.timerInterval) {
                clearInterval(gameState.timerInterval);
                gameState.timerInterval = null;
            }
        }

        function updateTimerDisplay() {
            const totalSeconds = Math.floor(getClockTime());
            const mins = Math.floor(totalSeconds / 60).toString().padStart(2, '0');
            const secs = (totalSeconds % 60).toString().padStart(2, '0');
            const timeStr = `${mins}:${secs}`;
            const d1 = document.getElementById('timerDisplay');
            const d2 = document.getElementById('matchTimeDisplay');
            const d3 = document.getElementById('headerTimerDisplay');
            if (d1) d1.textContent = timeStr;
            if (d2) d2.textContent = timeStr;
            if (d3) d3.textContent = timeStr;
        }

        // Also ensure sidebar toggle updates the court size
        function toggleSidePanel() {
            const panel = document.getElementById('sidePanel');
            const content = document.getElementById('centerContent');
            const toggle = document.getElementById('sidePanelToggle');
            if (!panel || !content || !toggle) return;
            panel.classList.toggle('open');
            content.classList.toggle('panel-open');
            toggle.classList.toggle('hidden');
            toggle.textContent = panel.classList.contains('open') ? '‹' : '›';
            setTimeout(resizeTacticalCourt, 350);
        }

        // ===== SERVING TEAM SELECTION =====
        function askServingTeam() {
            if (!hasMeaningfulProgress(gameState)) {
                const teamATextColor = getContrastTextColor(gameState.teamAColor);
                const teamBTextColor = getContrastTextColor(gameState.teamBColor);
                const servingDialog = document.createElement('div');
                servingDialog.id = 'servingDialog';
                servingDialog.innerHTML = `
                    <div style="position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 3000; display: flex; align-items: center; justify-content: center;">
                        <div style="background: var(--glass); border: 2px solid var(--primary); border-radius: 16px; padding: 30px; text-align: center; max-width: 320px;">
                            <h3 style="margin: 0 0 20px 0; color: var(--primary);">Who is serving?</h3>
                            <p style="font-size: 0.8rem; opacity: 0.7; margin-bottom: 25px;">Select the team that will serve first</p>
                            <div style="display: flex; gap: 15px; justify-content: center;">
                                <button onclick="window.setServingTeam('A')" style="padding: 15px 25px; background: var(--primary); color: ${teamATextColor}; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem;">
                                    ${gameState.teamAName}
                                </button>
                                <button onclick="window.setServingTeam('B')" style="padding: 15px 25px; background: var(--secondary); color: ${teamBTextColor}; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 1rem;">
                                    ${gameState.teamBName}
                                </button>
                            </div>
                        </div>
                    </div>
                `;
                document.body.appendChild(servingDialog);
            }
        }

        function hasMeaningfulProgress(state) {
            return state.scoreA > 0 || state.scoreB > 0 || state.setsWonA > 0 || state.setsWonB > 0 || state.history.length > 0;
        }

        function setServingTeam(team) {
            gameState.servingTeam = team;
            gameState.receivingTeam = team === 'A' ? 'B' : 'A';
            gameState.servingTeamLocked = true;
            renderLiveMatchUI();
            const dialog = document.getElementById('servingDialog');
            if (dialog) dialog.remove();
            persistLiveMatchState();
            showToast(`${team === 'A' ? gameState.teamAName : gameState.teamBName} will serve first`);
        }

        // ===== PROGRESS SAVING =====
        function saveLiveMatchProgress() {
            const progressData = { ...gameState, savedAt: new Date().toISOString() };
            delete progressData.timerInterval;
            localStorage.setItem(getLiveProgressStorageKey(), JSON.stringify(progressData));
            saveMatchStateToFirebase(gameState);
        }

        function storeProgressLocally(data) {
            localStorage.setItem(getLiveProgressStorageKey(), JSON.stringify(data));
        }

        // ===== UI UPDATE WRAPPERS =====
        function updateScoreboard() {
            const elA = document.getElementById('scoreA');
            const elB = document.getElementById('scoreB');
            if (elA) elA.textContent = gameState.scoreA;
            if (elB) elB.textContent = gameState.scoreB;

            const setsA = document.getElementById('setsA');
            const setsB = document.getElementById('setsB');
            if (setsA) setsA.textContent = gameState.setsWonA;
            if (setsB) setsB.textContent = gameState.setsWonB;

            const totalPoints = gameState.scoreA + gameState.scoreB;
            const pointDiff = Math.abs(gameState.scoreA - gameState.scoreB);
            const tpEl = document.getElementById('totalPoints');
            const pdEl = document.getElementById('pointDiff');
            if (tpEl) tpEl.textContent = totalPoints;
            if (pdEl) pdEl.textContent = pointDiff;

            let momentumPos = 50;
            if (totalPoints > 0) momentumPos = (gameState.scoreA / totalPoints) * 100;
            const mBar = document.getElementById('momentumBar');
            if (mBar) mBar.style.left = `${momentumPos}%`;

            const status = document.getElementById('matchStatus');
            if (status) status.textContent = gameState.matchComplete ? 'MATCH COMPLETE' : `SET ${gameState.currentSet} IN PROGRESS`;

            const fullscreenCurrentSet = document.getElementById('fullscreenCurrentSet');
            if (fullscreenCurrentSet) fullscreenCurrentSet.textContent = gameState.currentSet;

            updateMiniHistory();
        }

        function updateSetsUI() {
            for (let i = 1; i <= 5; i++) {
                const dot = document.getElementById(`setDot${i}`);
                if (!dot) continue;
                dot.className = 'set-dot';
                if (i <= gameState.setsWonA + gameState.setsWonB) {
                    if (i <= gameState.setsWonA) dot.classList.add('won-a');
                    else dot.classList.add('won-b');
                } else if (i === gameState.currentSet) {
                    dot.classList.add('active');
                }
            }
        }

        function renderRotationGrid() {
            const labelA = document.getElementById('rotationLabelA');
            const labelB = document.getElementById('rotationLabelB');
            if (labelA) labelA.textContent = `${gameState.teamAName} rotation`;
            if (labelB) labelB.textContent = `${gameState.teamBName} rotation`;
            renderRotationDots('rotationPositionsA', gameState.rotationA, 'active');
            renderRotationDots('rotationPositionsB', gameState.rotationB, 'team-b-active');
        }

        function renderRotationDots(containerId, activeIndex, activeClass) {
            const container = document.getElementById(containerId);
            if (!container) return;
            const labels = [2, 1, 6, 5, 4, 3];
            container.innerHTML = labels.map((label, index) =>
                `<span class="rot-pos ${index === activeIndex ? activeClass : ''}">${label}</span>`
            ).join('');
        }

        // ===== SCORING & ROTATION LOGIC =====
        function addPoint(team) {
            if (gameState.matchComplete) return;
            let rotationOccurred = false;

            if (team === 'A') {
                gameState.scoreA++;
                if (gameState.servingTeam === 'B') {
                    rotateTeam('A');
                    rotationOccurred = true;
                }
                gameState.servingTeam = 'A';
                gameState.receivingTeam = 'B';
            } else {
                gameState.scoreB++;
                if (gameState.servingTeam === 'A') {
                    rotateTeam('B');
                    rotationOccurred = true;
                }
                gameState.servingTeam = 'B';
                gameState.receivingTeam = 'A';
            }

            const now = new Date();
            const timeStr = now.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit' });
            addToHistory(timeStr, team, rotationOccurred);
            checkSetWin();
            renderLiveMatchUI();
            persistLiveMatchState();
            if (navigator.vibrate) navigator.vibrate(20);
        }

        function removePoint(team) {
            if (team === 'A' && gameState.scoreA > 0) gameState.scoreA--;
            else if (team === 'B' && gameState.scoreB > 0) gameState.scoreB--;
            else return;

            if (gameState.history.length > 0 && gameState.history[0].team === team) {
                const lastPoint = gameState.history.shift();
                if (lastPoint.causedRotation) {
                    if (team === 'A') gameState.rotationA = (gameState.rotationA + 5) % 6;
                    else gameState.rotationB = (gameState.rotationB + 5) % 6;
                }
            }
            renderLiveMatchUI();
            persistLiveMatchState();
        }

        function rotateTeam(team) {
            if (team === 'A') gameState.rotationA = (gameState.rotationA + 1) % 6;
            else gameState.rotationB = (gameState.rotationB + 1) % 6;
        }

        function manualRotate(team) {
            rotateTeam(team);
            renderLiveMatchUI();
            persistLiveMatchState();
        }

        function checkSetWin() {
            const minScore = 25;
            const winBy = 2;
            if ((gameState.scoreA >= minScore || gameState.scoreB >= minScore) && Math.abs(gameState.scoreA - gameState.scoreB) >= winBy) {
                if (gameState.scoreA > gameState.scoreB) gameState.setsWonA++;
                else gameState.setsWonB++;

                if (gameState.setsWonA >= 3 || gameState.setsWonB >= 3) {
                    gameState.matchComplete = true;
                    pauseTimer();
                } else {
                    gameState.currentSet++;
                    gameState.scoreA = 0;
                    gameState.scoreB = 0;
                    gameState.rotationA = 0;
                    gameState.rotationB = 0;
                }
            }
        }

        // ===== TACTICAL COURT & ROSTER =====
        const courtPositions = {
            // Order matches index.html slot arrays: 2, 1, 6, 5, 4, 3
            A: [{ t: '38%', l: '20%' }, { t: '15%', l: '20%' }, { t: '15%', l: '50%' }, { t: '15%', l: '80%' }, { t: '38%', l: '80%' }, { t: '38%', l: '50%' }],
            B: [{ t: '62%', l: '80%' }, { t: '85%', l: '80%' }, { t: '85%', l: '50%' }, { t: '85%', l: '20%' }, { t: '62%', l: '20%' }, { t: '62%', l: '50%' }]
        };
        const teamDisplayOffsets = { A: 0, B: 0 };

        function updateTacticalCourt() {
            const court = document.getElementById('courtFloor');
            if (!court) return;
            court.querySelectorAll('.court-player').forEach(el => el.remove());

            const renderTeam = (players, rot, teamKey, suffix) => {
                if (!players) return;
                players.slice(0, 6).forEach((player, index) => {
                    const posIndex = (index + rot + teamDisplayOffsets[teamKey]) % 6;
                    const pos = courtPositions[teamKey][posIndex];
                    const teamColor = player.role === 'Libero'
                        ? '#ffeb3b'
                        : (teamKey === 'A' ? gameState.teamAColor : gameState.teamBColor);
                    const el = document.createElement('div');
                    el.className = `court-player team-${teamKey.toLowerCase()} ${player.role === 'Libero' ? 'libero' : ''}`;
                    el.style.top = pos.t;
                    el.style.left = pos.l;
                    const gender = (player.gender || 'male').toLowerCase();
                    const spritePath = `Sprites/TEAM%20${teamKey}/${teamKey}${gender}${suffix}.png`;
                    el.innerHTML = `
                        <div class="court-player-label" style="border-color:${teamColor}; box-shadow:0 0 20px ${teamColor}; text-shadow:0 0 8px ${teamColor};">
                            <span class="court-player-num">${player.num || index + 1}</span>
                            <span class="court-player-name" style="color:#fff;">${player.name || 'Player'}</span>
                        </div>
                        <img class="court-player-sprite" src="${spritePath}" alt="${player.name || 'Player'}" onerror="this.src='Sprites/TEAM%20${teamKey}/${teamKey}male${suffix}.png'">
                    `;
                    court.appendChild(el);
                });
            };
            renderTeam(gameState.teamAPlayers, gameState.rotationA, 'A', 'Front');
            renderTeam(gameState.teamBPlayers, gameState.rotationB, 'B', 'Back');
            resizeTacticalCourt();
        }

        function resizeTacticalCourt() {
            const wrapper = document.getElementById('tacticalWrapper');
            const court = wrapper ? wrapper.querySelector('.court-base') : null;
            if (!wrapper || !court) return;
            const scale = Math.min(wrapper.clientWidth / 450, wrapper.clientHeight / 900);
            court.style.transform = `scale(${scale})`;
        }

        function parseColorToRgb(color) {
            if (!color) return null;
            const trimmed = color.trim();
            let hex = trimmed.startsWith('#') ? trimmed.slice(1) : trimmed;
            if (/^[0-9a-f]{3}$/i.test(hex)) {
                hex = hex.split('').map((char) => char + char).join('');
            }
            if (/^[0-9a-f]{6}$/i.test(hex)) {
                return {
                    r: parseInt(hex.slice(0, 2), 16),
                    g: parseInt(hex.slice(2, 4), 16),
                    b: parseInt(hex.slice(4, 6), 16)
                };
            }

            const rgbMatch = trimmed.match(/^rgba?\(\s*(\d{1,3})\s*,\s*(\d{1,3})\s*,\s*(\d{1,3})/i);
            if (!rgbMatch) return null;
            return {
                r: Number(rgbMatch[1]),
                g: Number(rgbMatch[2]),
                b: Number(rgbMatch[3])
            };
        }

        function getContrastTextColor(color) {
            const rgb = parseColorToRgb(color);
            if (!rgb) return '#ffffff';
            const yiq = ((rgb.r * 299) + (rgb.g * 587) + (rgb.b * 114)) / 1000;
            return yiq >= 160 ? '#000000' : '#ffffff';
        }

        function applyTeamColors() {
            const root = document.documentElement;
            root.style.setProperty('--primary', gameState.teamAColor);
            root.style.setProperty('--secondary', gameState.teamBColor);
            root.style.setProperty('--primary-contrast', getContrastTextColor(gameState.teamAColor));
            root.style.setProperty('--secondary-contrast', getContrastTextColor(gameState.teamBColor));
        }

        // ===== DATA INTEGRATION =====
        function loadFromMainApp() {
            const dataStr = activeMatchSource === 'matcharena'
                ? localStorage.getItem(getLiveMatchDataStorageKey())
                : (
                    localStorage.getItem(getLiveMatchDataStorageKey()) ||
                    localStorage.getItem('squadGen3D_liveMatchData')
                );
            if (!dataStr) { createSampleData(); return; }
            try {
                const data = JSON.parse(dataStr);
                activeMatchSource = normalizeMatchSource(data.source || activeMatchSource);
                activeMatchKey = normalizeMatchKey(data.matchKey || activeMatchKey);
                hasLaunchPayload = true;
                gameState.teamAPlayers = normalizeImportedRotationOrder(data.teamA || [], 'A');
                gameState.teamBPlayers = normalizeImportedRotationOrder(data.teamB || [], 'B');
                gameState.teamAName = data.teamAName || 'TEAM A';
                gameState.teamBName = data.teamBName || 'TEAM B';
                gameState.teamAColor = data.teamAColor || '#00fbff';
                gameState.teamBColor = data.teamBColor || '#ff0055';
                applyTeamColors();
                updateTeamNames();
            } catch (e) {
                console.error("Error loading roster:", e);
                createSampleData();
            }
        }

        function normalizeImportedRotationOrder(players, team) {
            const starters = Array.isArray(players) ? players.slice(0, 6) : [];
            const bases = {
                A: [{ t: '80%', l: '35%' }, { t: '80%', l: '10%' }, { t: '50%', l: '10%' }, { t: '20%', l: '10%' }, { t: '20%', l: '35%' }, { t: '50%', l: '40%' }],
                B: [{ t: '20%', l: '65%' }, { t: '20%', l: '90%' }, { t: '50%', l: '90%' }, { t: '80%', l: '90%' }, { t: '80%', l: '65%' }, { t: '50%', l: '60%' }]
            };
            const assigned = new Array(6).fill(null);
            const playerAssignments = new Array(starters.length).fill(-1);
            const candidates = [];

            starters.forEach((player, playerIndex) => {
                bases[team].forEach((slot, slotIndex) => {
                    const distance = Math.hypot(
                        parseFloat(slot.t) - parseFloat(player.currentTop),
                        parseFloat(slot.l) - parseFloat(player.currentLeft)
                    );
                    candidates.push({ playerIndex, slotIndex, distance });
                });
            });

            candidates.sort((a, b) => a.distance - b.distance);

            candidates.forEach(({ playerIndex, slotIndex }) => {
                if (playerAssignments[playerIndex] !== -1) return;
                if (assigned[slotIndex]) return;
                assigned[slotIndex] = starters[playerIndex];
                playerAssignments[playerIndex] = slotIndex;
            });

            let nextFreeSlot = 0;
            starters.forEach((player, playerIndex) => {
                if (playerAssignments[playerIndex] !== -1) return;
                while (nextFreeSlot < assigned.length && assigned[nextFreeSlot]) nextFreeSlot++;
                if (nextFreeSlot < assigned.length) {
                    assigned[nextFreeSlot] = player;
                    playerAssignments[playerIndex] = nextFreeSlot;
                }
            });

            return assigned.filter(Boolean);
        }

        function createSampleData() {
            const roles = ['Setter', 'Outside', 'Middle', 'Opposite', 'Libero', 'Outside'];
            const createPlayers = (prefix) => Array.from({ length: 6 }, (_, i) => ({ name: `${prefix} ${i + 1}`, num: i + 1, role: roles[i], gender: 'male' }));
            gameState.teamAPlayers = createPlayers('Player');
            gameState.teamBPlayers = createPlayers('Opponent');
        }

        // ===== UI UTILS =====
        function setupUIEvents() {
            document.addEventListener('keydown', (e) => {
                const key = e.key.toLowerCase();
                if (key === 'f') {
                    e.preventDefault();
                    toggleScoreboardFullscreen();
                    return;
                }
                if (gameState.matchComplete) return;
                if (key === 'a' || e.key === 'ArrowLeft') addPoint('A');
                else if (key === 'd' || e.key === 'ArrowRight') addPoint('B');
                else if (e.key === ' ') { e.preventDefault(); gameState.timerIsPaused ? startTimer() : pauseTimer(); }
                else if (key === 't') toggleSidePanel();
            });
        }

        function updateMiniHistory() {
            const container = document.getElementById('miniHistory');
            if (!container) return;
            const recent = gameState.history.slice(0, 5);
            container.innerHTML = recent.map(item => `<span class="mini-dot team-${item.team.toLowerCase()}"></span>`).join('') +
                '<span class="mini-dot"></span>'.repeat(Math.max(0, 5 - recent.length));
        }

        function updateHistoryDisplay() {
            const container = document.getElementById('historyList');
            if (!container) return;
            if (gameState.history.length === 0) {
                container.innerHTML = `<div style="opacity: 0.5; text-align: center; font-size: 0.7rem; padding: 20px;">No points yet</div>`;
                scrollHistoryListToRight(container);
                return;
            }
            container.innerHTML = gameState.history.map(item => `
                <div class="history-item">
                    <span class="history-time">${item.time}</span>
                    <span class="history-team-${item.team.toLowerCase()}">${item.teamName} scored</span>
                    <span style="margin-left: auto; opacity: 0.5; font-size: 0.65rem;">${item.scoreA}-${item.scoreB}</span>
                </div>
            `).join('');
            scrollHistoryListToRight(container);
        }

        function updateServingIndicator() {
            const indicator = document.getElementById('servingIndicator');
            const label = document.getElementById('servingTeam');
            if (!label) return;
            const isA = gameState.servingTeam === 'A';
            label.textContent = `${isA ? gameState.teamAName : gameState.teamBName} serving`;
            if (indicator) {
                indicator.style.color = isA ? gameState.teamAColor : gameState.teamBColor;
                indicator.style.borderColor = isA ? gameState.teamAColor : gameState.teamBColor;
            }
        }

        function updateTeamNames() {
            ['teamAName', 'teamBName', 'btnTeamA', 'btnTeamB'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.textContent = id.includes('A') ? gameState.teamAName : gameState.teamBName;
            });
        }

        function updateCompNames() {
            const a = document.getElementById('compTeamAName');
            const b = document.getElementById('compTeamBName');
            if (a) a.textContent = gameState.teamAName.substring(0, 8);
            if (b) b.textContent = gameState.teamBName.substring(0, 8);
        }

        function addToHistory(time, team, causedRotation) {
            gameState.history.unshift({
                time, team, teamName: team === 'A' ? gameState.teamAName : gameState.teamBName,
                scoreA: gameState.scoreA, scoreB: gameState.scoreB, causedRotation
            });
            if (gameState.history.length > 20) gameState.history = gameState.history.slice(0, 20);
        }

        function handleCourtRotationClick(e) {
            const rect = e.currentTarget.getBoundingClientRect();
            rotateTeam((e.clientY - rect.top) < rect.height / 2 ? 'A' : 'B');
            renderLiveMatchUI();
            persistLiveMatchState();
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            if (toast) { toast.textContent = message; toast.classList.add('show'); setTimeout(() => toast.classList.remove('show'), 2500); }
        }

        function scrollHistoryListToRight(container = document.getElementById('historyList')) {
            if (!container || !window.matchMedia(MOBILE_LAYOUT_QUERY).matches) return;
            requestAnimationFrame(() => {
                container.scrollLeft = container.scrollWidth;
            });
        }

        function updateMobilePanelMetrics() {
            const root = document.documentElement;
            const panel = document.getElementById('rightPanel');
            const isMobileLayout = window.matchMedia(MOBILE_LAYOUT_QUERY).matches;
            if (!root || !panel || !isMobileLayout || !panel.classList.contains('mobile-open')) {
                root.style.setProperty('--mobile-controls-panel-height', '0px');
                return;
            }
            root.style.setProperty('--mobile-controls-panel-height', `${Math.ceil(panel.getBoundingClientRect().height)}px`);
        }

        function getFullscreenElement() {
            return document.fullscreenElement || document.webkitFullscreenElement || null;
        }

        function getScoreboardFullscreenEnterIcon() {
            return `
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M8 3H3V8M16 3H21V8M21 16V21H16M8 21H3V16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
            `;
        }

        function getScoreboardFullscreenExitIcon() {
            return `
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                    <path d="M9 3H3V9M15 3H21V9M21 15V21H15M9 21H3V15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                    <path d="M9 9H5M9 9V5M15 9H19M15 9V5M15 15H19M15 15V19M9 15H5M9 15V19" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
                </svg>
            `;
        }

        function updateScoreboardFullscreenUI() {
            const header = document.getElementById('matchHeader');
            const button = document.getElementById('scoreboardFullscreenToggle');
            if (!header || !button) return;

            const isActive = getFullscreenElement() === header;
            header.classList.toggle('scoreboard-fullscreen', isActive);
            button.classList.toggle('is-active', isActive);
            button.innerHTML = isActive ? getScoreboardFullscreenExitIcon() : getScoreboardFullscreenEnterIcon();
            button.setAttribute('aria-label', isActive ? 'Esci dal banner fullscreen' : 'Apri banner fullscreen');
            button.title = isActive ? 'Esci dal banner fullscreen' : 'Apri banner fullscreen';
        }

        async function toggleScoreboardFullscreen() {
            const header = document.getElementById('matchHeader');
            if (!header) return;

            try {
                if (getFullscreenElement() === header) {
                    if (document.exitFullscreen) {
                        await document.exitFullscreen();
                    } else if (document.webkitExitFullscreen) {
                        document.webkitExitFullscreen();
                    }
                    return;
                }

                if (header.requestFullscreen) {
                    await header.requestFullscreen();
                } else if (header.webkitRequestFullscreen) {
                    header.webkitRequestFullscreen();
                } else {
                    showToast('Fullscreen non supportato su questo dispositivo');
                }
            } catch (error) {
                console.error('Errore fullscreen banner:', error);
                showToast('Impossibile aprire il banner fullscreen');
            }
        }

        function initScoreboardFullscreen() {
            const header = document.getElementById('matchHeader');
            const button = document.getElementById('scoreboardFullscreenToggle');
            if (!header || !button) return;

            const supported = !!(header.requestFullscreen || header.webkitRequestFullscreen);
            if (!supported) {
                button.style.display = 'none';
                return;
            }

            button.addEventListener('click', toggleScoreboardFullscreen);
            document.addEventListener('fullscreenchange', updateScoreboardFullscreenUI);
            document.addEventListener('webkitfullscreenchange', updateScoreboardFullscreenUI);
            updateScoreboardFullscreenUI();
        }

        function toggleMobileControls() {
            const p = document.getElementById('rightPanel');
            const toggle = document.getElementById('mobileToggle');
            if (!p || !toggle) return;
            const isOpen = p.classList.toggle('mobile-open');
            document.body.classList.toggle('mobile-controls-open', isOpen);
            toggle.classList.toggle('is-open', isOpen);
            toggle.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
            requestAnimationFrame(updateMobilePanelMetrics);
        }

        function syncResponsiveLayout() {
            resizeTacticalCourt();
            const rightPanel = document.getElementById('rightPanel');
            const toggle = document.getElementById('mobileToggle');
            if (!window.matchMedia(MOBILE_LAYOUT_QUERY).matches && rightPanel) {
                rightPanel.classList.remove('mobile-open');
                document.body.classList.remove('mobile-controls-open');
                if (toggle) {
                    toggle.classList.remove('is-open');
                    toggle.setAttribute('aria-expanded', 'false');
                }
            }
            updateMobilePanelMetrics();
        }

        function resetMatch() {
            if (!confirm('Davvero vuoi resettare il match?')) return;
            detachLiveMatchSync();
            gameState.scoreA = 0; gameState.scoreB = 0; gameState.setsWonA = 0; gameState.setsWonB = 0;
            gameState.currentSet = 1; gameState.history = []; gameState.matchComplete = false;
            gameState.rotationA = 0; gameState.rotationB = 0;
            gameState.servingTeam = 'A';
            gameState.servingTeamLocked = false;
            gameState.receivingTeam = 'B';
            gameState.timerAccumulatedSeconds = 0;
            gameState.timerLastStartedAt = 0;
            gameState.timerIsPaused = true;
            resetTimer();
            storeProgressLocally({ ...gameState, savedAt: new Date().toISOString() });
            saveMatchStateToFirebase(gameState);
            renderLiveMatchUI();
            document.getElementById('matchCompleteOverlay').classList.remove('active');
            attachLiveMatchSync();
        }

        function newMatch() {
            resetMatch();
        }

        function backToGenerator() {
            location.href = 'index.html';
        }

        // ===== EXPOSE TO GLOBAL SCOPE =====
        window.saveMatchStateToFirebase = saveMatchStateToFirebase;
        window.loadLiveMatchProgress = loadLiveMatchProgress;
        window.startTimer = startTimer;
        window.pauseTimer = pauseTimer;
        window.resetTimer = resetTimer;
        window.toggleSidePanel = toggleSidePanel;
        window.askServingTeam = askServingTeam;
        window.setServingTeam = setServingTeam;
        window.saveLiveMatchProgress = saveLiveMatchProgress;
        window.updateScoreboard = updateScoreboard;
        window.updateSetsUI = updateSetsUI;
        window.renderRotationGrid = renderRotationGrid;
        window.addPoint = addPoint;
        window.removePoint = removePoint;
        window.rotateTeam = rotateTeam;
        window.manualRotate = manualRotate;
        window.showToast = showToast;
        window.toggleMobileControls = toggleMobileControls;
        window.toggleScoreboardFullscreen = toggleScoreboardFullscreen;
        window.resetMatch = resetMatch;
        window.newMatch = newMatch;
        window.backToGenerator = backToGenerator;
        window.updateTacticalCourt = updateTacticalCourt;

        // --- BACK BUTTON ---
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = 'MatchArena.html';
            }
        }

        // Expose to global scope
        window.goBack = goBack;
    </script>

    <!-- Back Button -->
    <button class="back-button" id="backButton" onclick="goBack()" title="Go Back">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5"></path>
            <path d="M12 19l-7-7 7-7"></path>
        </svg>
    </button>
